<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar clase | FitPower</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&family=TASA+Explorer:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../css/styles.css">
    <link rel="stylesheet" href="../../../css/dashboards/comun.css">
    <link rel="stylesheet" href="../../../css/dashboards/interfaces.css">
    <link rel="stylesheet" href="../../../css/responsives/dashboardsresponsive/comunresponsive.css">
</head>
<body class="interface-page professor-interface" data-teacher-id="profesor-demo">
    <header>
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center header-contenido">
                <h1 class="logo"><a href="../../../../index.html">FitPower</a></h1>
                <div class="header-derecha">
                    <span class="header-text">Nombre Apellido</span>
                    <img src="../../../assets/imagenes/img6.jpg" class="usuario-header" alt="Foto de perfil">
                    <button class="boton-menu role-nav-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#roleNavigation" aria-controls="roleNavigation" aria-label="Abrir navegación">
                        <span></span><span></span><span></span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="interface-layout">
        <aside class="interface-sidebar offcanvas offcanvas-start" id="roleNavigation" tabindex="-1" aria-labelledby="roleNavigationTitle">
            <div class="offcanvas-header d-lg-none">
                <h2 class="offcanvas-title" id="roleNavigationTitle">Profesor</h2>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
            </div>
            <div class="offcanvas-body">
                <nav aria-label="Navegación de profesor">
                    <div class="interface-nav-group">
                        <h3>Alumnos</h3>
                        <a href="profesor.html">Alumnos activos</a>
                    </div>
                    <div class="interface-nav-group">
                        <h3>Clases</h3>
                        <a href="seleccionar-clase.html" aria-current="page">Gestionar una clase</a>
                        <a href="clases.html">Próximas fechas</a>
                    </div>
                </nav>
            </div>
        </aside>

        <main class="interface-content">
            <div class="interface-heading">
                <div>
                    <h1>Selecciona una clase</h1>
                    <p>Elige la clase que quieres gestionar para abrir su panel.</p>
                </div>
            </div>

            <section class="class-choice-grid" id="assignedClassChoices" aria-label="Clases asignadas"></section>
            <p class="interface-empty" id="noAssignedClasses" hidden>No tienes clases asignadas todavía.</p>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../js/dashboard/profesor.js"></script>
