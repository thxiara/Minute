<!DOCTYPE html>
<html lang="es" class="verificando-sesion">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitPower - Vista Profesor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >
    <link rel="stylesheet" href="../../../css/styles.css">
    <link rel="stylesheet" href="../../../css/dashboards/comun.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&family=TASA+Explorer:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../../../css/dashboards/profesor.css"
    >

    <link
        rel="stylesheet"
        href="../../../css/responsives/dashboardsresponsive/comunresponsive.css"
    >

    <link
        rel="stylesheet"
        href="../../../css/responsives/dashboardsresponsive/profesorresponsive.css"
    >

<!-- Oculta el panel hasta que Session.requireRole() confirme sesión y rol (ver js/session.js). 
    <style>
        html.verificando-sesion body { visibility: hidden; }
    </style>
-->

</head>


<body>

    <div class="container-fluid profesor-page p-0">

        <header>

            <div class="container-fluid">

                <div class="d-flex justify-content-between align-items-center header-contenido">

                     <h1 class="logo">
                        <a href="../../../../index.html">FitPower</a>
                    </h1>

                    <div class="header-derecha">

                            <span class="header-text">
                                Nombre Apellido
                            </span>

                                <img
                                src="../../../assets/imagenes/img6.jpg" class="usuario-header" alt="Usuario">

                            <button
                                class="boton-menu"
                                type="button"
                                data-bs-toggle="offcanvas"
                                data-bs-target="#menuLateral"
                                aria-controls="menuLateral"
                                aria-label="Abrir menú"
                            >
                                <span></span>
                                <span></span>
                                <span></span>
                            </button>

                    </div>

                </div>

            </div>

        </header>


        <div class="row g-0 profesor-content">


            <aside class="col-md-auto barra-lateral d-none d-md-block">

                <div class="seccion-barra-lateral">

                    <div class="titulo-barra-lateral">

                        <span>
                            Alumnos
                        </span>

                        <button
                            class="boton-flecha"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#alumnosMenu"
                            aria-expanded="true"
                        >
                            V
                        </button>

                    </div>


                    <div
                        class="collapse show"
                        id="alumnosMenu"
                    >

                        <a
                            href="#"
                            class="enlace-barra-lateral activo"
                        >
                            Socios activos
                        </a>

                    </div>

                </div>


                <div class="seccion-barra-lateral">

                    <div class="titulo-barra-lateral">

                        <span>
                            Clases
                        </span>

                        <button
                            class="boton-flecha"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#clasesMenu"
                            aria-expanded="false"
                        >
                            &lt;
                        </button>

                    </div>


                    <div
                        class="collapse"
                        id="clasesMenu"
                    >

                        <a
                            href="#"
                            class="enlace-barra-lateral"
                        >
                            Mis clases
                        </a>

                        <a
                            href="#"
                            class="enlace-barra-lateral"
                        >
                            Horarios
                        </a>

                    </div>

                </div>

            </aside>


            <div
                class="offcanvas offcanvas-start barra-lateral-movil"
                tabindex="-1"
                id="menuLateral"
            >

                <div class="offcanvas-body">

                    <div class="seccion-barra-lateral">

                        <div class="titulo-barra-lateral">

                            <span>
                                Alumnos
                            </span>

                            <button
                                class="boton-flecha"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#alumnosMobile"
                                aria-expanded="true"
                            >
                                V
                            </button>

                        </div>


                        <div
                            class="collapse show"
                            id="alumnosMobile"
                        >

                            <a
                                href="#"
                                class="enlace-barra-lateral activo"
                            >
                                Socios activos
                            </a>

                        </div>

                    </div>


                    <div class="seccion-barra-lateral">

                        <div class="titulo-barra-lateral">

                            <span>
                                Clases
                            </span>

                            <button
                                class="boton-flecha"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#clasesMobile"
                                aria-expanded="false"
                            >
                                &lt;
                            </button>

                        </div>


                        <div
                            class="collapse"
                            id="clasesMobile"
                        >

                            <a
                                href="#"
                                class="enlace-barra-lateral"
                            >
                                Mis clases
                            </a>

                            <a
                                href="#"
                                class="enlace-barra-lateral"
                            >
                                Horarios
                            </a>

                        </div>

                    </div>

                </div>

            </div>


            <main class="col main-content">

                <div class="content-title">

                    <h1>
                        Alumnos Activos
                    </h1>

                </div>


                <div class="students-container">


                    <div class="d-flex justify-content-between align-items-center table-top">

                        <div class="registros">

                            Mostrar

                            <select>

                                <option>
                                    25
                                </option>

                                <option>
                                    10
                                </option>

                                <option>
                                    50
                                </option>

                            </select>

                            registros

                        </div>


                        <div class="search">

                            <input
                                type="text"
                                aria-label="Buscar"
                                placeholder="Buscar alumnos"
                            >

                            <button
                                type="button"
                                aria-label="Buscar"
                            >
                                ⌕
                            </button>

                        </div>

                    </div>


                    <div class="table-responsive">

                        <table class="table tabla-alumnos">

                            <thead>

                                <tr>

                                    <th>
                                        Nombre
                                    </th>

                                    <th>
                                        Cel.
                                    </th>

                                    <th>
                                        Desempeño(Mes)
                                    </th>

                                    <th>
                                        Nota
                                    </th>

                                    <th class="text-end">
                                        Acciones
                                    </th>

                                </tr>

                            </thead>


                            <tbody>

                                <tr>

                                    <td>pepe</td>

                                    <td>123 456 789</td>

                                    <td>10/10</td>

                                    <td class="nota">

                                        <span class="nota-texto">
                                            muy mal
                                        </span>

                                        <button type="button" class="leer-mas">
                                            leer más
                                        </button>

                                    </td>

                                    <td class="acciones">

                                        <button
                                            type="button"
                                            class="action-button"
                                        >
                                            ⋮
                                        </button>


                                        <div class="action-menu">

                                            <button type="button">

                                                <span class="icono-ver">
                                                    ●
                                                </span>

                                                Ver perfil

                                            </button>


                                            <button type="button">

                                                <span class="icono-evaluacion">
                                                    ◆
                                                </span>

                                                Dar evaluación

                                            </button>

                                        </div>

                                    </td>

                                </tr>


                                <tr>

                                    <td>papa</td>
                                    <td>987 654 321</td>
                                    <td>0/10</td>
                                    <td class="nota">
                                        <span class="nota-texto">
                                            Algo algo algo
                                        </span>
                                        <button type="button" class="leer-mas">
                                            leer más
                                        </button>
                                    </td>

                                    <td class="acciones">

                                        <button
                                            type="button"
                                            class="action-button"
                                        >
                                            ⋮
                                        </button>


                                        <div class="action-menu">

                                            <button type="button">

                                                <span class="icono-ver">
                                                    ●
                                                </span>

                                                Ver perfil

                                            </button>


                                            <button type="button">

                                                <span class="icono-evaluacion">
                                                    ◆
                                                </span>

                                                Dar evaluación

                                            </button>

                                        </div>

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>


                    <div class="pagination">

                        <button type="button">
                            ←
                        </button>

                        <button type="button">
                            →
                        </button>

                    </div>

                </div>

            </main>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../js/api.js"></script>
    <script src="../../../js/dashboard/profesor.js"></script>

<!-- Sacar el chequeo de sesión de la vista, lo tiene que manejar el backend
    <script src="../../../js/session.js"></script>

    <script>
        (async () => {
            const sesion = await Session.requireRole([Session.ROLES.PROFESOR]);
            if (!sesion) return;

            const nombreUsuario = document.querySelector('.nombre-usuario');
            if (nombreUsuario) {
                nombreUsuario.textContent = sesion.name;
            }
        })();
    </script>
-->

</body>

</html>
