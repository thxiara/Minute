
<!DOCTYPE html>
<html lang="es">
<head>
    <base href="../../../">
    <script>
        const assetFallbackPrefix = '/front/dist/';
        const assetFallbackRoot = document.querySelector('base') ? '' : 'dist/';

        document.addEventListener('error', (event) => {
            const element = event.target;
            if (!(element instanceof Element)) return;

            const attribute = element.hasAttribute('href') ? 'href' : 'src';
            const url = element.getAttribute(attribute);
            if (!url?.startsWith(assetFallbackPrefix)) return;

            const fallbackUrl = assetFallbackRoot + url.slice(assetFallbackPrefix.length);
            if (element instanceof HTMLScriptElement) {
                const replacement = document.createElement('script');
                replacement.src = fallbackUrl;
                element.after(replacement);
                element.remove();
            } else {
                element.setAttribute(attribute, fallbackUrl);
            }
        }, true);
    </script>
    <link rel="icon" type="image/png" href="/front/dist/assets/iconos/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutinas | FitPower</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&family=TASA+Explorer:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/front/dist/css/styles.css">
    <link rel="stylesheet" href="/front/dist/css/dashboards/comun.css">
    <link rel="stylesheet" href="/front/dist/css/dashboards/interfaces.css">
    <link rel="stylesheet" href="/front/dist/css/responsives/dashboardsresponsive/comunresponsive.css">
    <!-- Traducciones: tiene que cargarse antes que el resto de los scripts -->
    <script src="/front/dist/js/i18n.js"></script>
</head>
<body class="interface-page trainer-interface">
    <header>
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center header-contenido">
                <h1 class="logo"><a href="/">FitPower</a></h1>
                <div class="header-derecha">
                    <span class="header-text">{{nombre}}</span>
                    <img src="/front/dist/assets/imagenes/img6.jpg" class="usuario-header" alt="Foto de perfil">
                    <button class="boton-menu role-nav-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#roleNavigation" aria-controls="roleNavigation" aria-label="Abrir navegación">
                        <span></span><span></span><span></span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="interface-layout">
        <aside class="interface-sidebar offcanvas offcanvas-start" id="roleNavigation" tabindex="-1" aria-labelledby="roleNavigationTitle">
            <div class="offcanvas-header d-lg-none">
                <h2 class="offcanvas-title" id="roleNavigationTitle">Entrenador</h2>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
            </div>
            <div class="offcanvas-body">
              <nav aria-label="Navegación de entrenador">
                <div class="interface-nav-group">
                    <h3>Socios</h3>
                    <a href="/dash/entrenador">Socios activos</a>
                </div>
                <div class="interface-nav-group">
                    <h3>Entrenamientos</h3>
                    <a href="/dash/entrenador/ejercicios">Ejercicios</a>
                    <a href="/dash/entrenador/rutinas" aria-current="page">Rutinas</a>
                </div>
                  <a href="/logout" class="cerrar">Cerrar sesión</a>
              </nav>
            </div>
        </aside>

        <main class="interface-content">
            <div class="interface-heading">
                <div>
                    <h1>Rutinas</h1>
                </div>
                <button class="interface-button" type="button" data-bs-toggle="modal" data-bs-target="#routineModal">Crear rutina</button>
            </div>

            <section id="rutinas" aria-label="Rutinas guardadas">
                <p id="routinePageFeedback" class="interface-feedback" role="status"></p>
                <div class="routine-card-grid" id="routineList"></div>
                <p class="interface-empty" id="emptyRoutineList" hidden>No hay rutinas guardadas.</p>
            </section>
        </main>
    </div>

    <div class="modal fade" id="routineModal" tabindex="-1" aria-labelledby="routineModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-xl">
            <div class="modal-content interface-modal">
                <form id="routineForm">
                    <div class="modal-header">
                        <div>
                            <h2 class="modal-title" id="routineModalTitle">Crear rutina</h2>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-4">
                            <label class="form-label" for="routineName">Título</label>
                            <input class="form-control" id="routineName" name="name" maxlength="40" required>
                        </div>
                        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                            <div>
                                <h3 class="routine-editor-heading">Ejercicios</h3>
                                <p class="mb-0 text-secondary">Tené en cuenta el orden de la lista.</p>
                            </div>
                            <button class="interface-button-secondary" id="addRoutineExercise" type="button">Agregar ejercicio</button>
                        </div>
                        <div class="routine-exercise-editor" id="routineExerciseRows"></div>
                        <p id="noExercisesMessage" class="interface-empty" hidden>Primero agrega ejercicios a la biblioteca.</p>
                        <p id="routineFeedback" class="interface-feedback" role="status"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="interface-button-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="interface-button">Guardar rutina</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="routineDetailModal" tabindex="-1" aria-labelledby="routineDetailTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content interface-modal">
                <div class="modal-header">
                    <div>
                        <h2 class="modal-title" id="routineDetailTitle"></h2>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <img class="routine-detail-image" id="routineDetailImage" alt="">
                    <ol class="routine-detail-exercises" id="routineDetailExercises"></ol>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/front/dist/js/api.js"></script>
    <script src="/front/dist/js/dashboard/entrenador.js"></script>
</body>
</html>
