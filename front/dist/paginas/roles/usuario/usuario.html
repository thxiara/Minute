<!DOCTYPE html>
<html lang="es">

<head>
    <base href="/front/dist/">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitPower - Usuario</title>


    <!-- boostrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- google fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&family=TASA+Explorer:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- css -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/dashboards/comun.css">

    <link
        rel="stylesheet"
        href="css/dashboards/usuario.css"
    >
    <link rel="stylesheet" href="css/dashboards/interfaces.css">

    <link
        rel="stylesheet"
        href="css/responsives/dashboardsresponsive/comunresponsive.css"
    >

    <link
        rel="stylesheet"
        href="css/responsives/dashboardsresponsive/usuarioresponsive.css"
    >


</head>


<body>

    <div class="container-fluid usuario-page p-0">

        <header>

            <div class="container-fluid">

                <div class="d-flex justify-content-between align-items-center header-contenido">

                     <h1 class="logo">
                        <a href="../index.html">FitPower</a>
                    </h1>

                    <div class="header-derecha">

                            <span class="header-text" id="memberHeaderName">
                                Nombre apellido jiji
                            </span>

                                <img
                                src="assets/imagenes/img6.jpg" class="usuario-header" alt="Usuario" data-profile-photo>

                            <button
                                class="boton-menu"
                                type="button"
                                data-bs-toggle="offcanvas"
                                data-bs-target="#menuLateral"
                                aria-controls="menuLateral"
                                aria-label="Abrir menú"
                            >
                                <span></span>
                                <span></span>
                                <span></span>
                            </button>

                    </div>

                </div>

            </div>

        </header>

        <!-- menu lateral  -->

        <div
            class="offcanvas offcanvas-end menu-usuario"
            tabindex="-1"
            id="menuLateral"
        >

            <div class="offcanvas-header">

                <h5 class="offcanvas-title">
                    Menú
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="offcanvas"
                    aria-label="Cerrar"
                ></button>

            </div>


            <div class="offcanvas-body">

                <a
                    href="/dash/socio#perfil"
                    class="menu-link"
                >
                    Mi perfil
                </a>


                <a
                    href="/dash/socio#rutinas"
                    class="menu-link"
                >
                    Mis rutinas
                </a>


                <a
                    href="/dash/socio#clases"
                    class="menu-link"
                >
                    Mis clases
                </a>


                <a
                    href="/dash/socio#"
                    class="menu-link cerrar"
                >
                    Cerrar sesión
                </a>

            </div>

        </div>



        <!-- contenido -->

        <main class="usuario-content">


            <!-- presentacion -->

            <section class="presentacion">


                <div class="perfil" id="perfil">

                    <div class="foto-usuario-control">
                        <button type="button" class="foto-usuario-trigger" id="changePhotoButton" aria-label="Cambiar foto de perfil">
                            <img
                                src="assets/imagenes/img6.jpg"
                                alt="Usuario"
                                class="foto-usuario"
                                data-profile-photo
                            >
                            <span>Cambiar foto</span>
                        </button>
                        <input class="visually-hidden" type="file" id="profilePhotoInput" accept="image/*" aria-hidden="true" tabindex="-1">
                    </div>


                    <h1 id="memberGreeting">
                        Hola, Nombre
                    </h1>


                </div>

		<a href="/logout">
                <button type="button" class="cerrar-sesion">
                    Cerrar sesión
                </button>
		</a>

            </section>



            <!-- linea -->

            <div class="linea"></div>

            <!-- info de membresia -->

            <p id="photoFeedback" class="photo-feedback" role="status" aria-live="polite"></p>

            <section class="informacion-membresia" id="membresia">


                <div class="dato-membresia">

                    <span class="dato-titulo">
                        MEMBRESÍA
                    </span>

                    <span class="dato-valor">
                        Plan Pro
                    </span>

                </div>


                <div class="dato-membresia">

                    <span class="dato-titulo">
                        VENCIMIENTO
                    </span>

                    <span class="dato-valor" id="membershipExpiration">
                        14/11/2026
                    </span>

                </div>


                <div class="dato-membresia">

                    <span class="dato-titulo">
                        MIEMBRO DESDE
                    </span>

                    <span class="dato-valor">
                        12/04/2026
                    </span>

                </div>


            </section>

            <p id="membershipExpiryNotice" class="membership-expiry-notice" role="status" hidden></p>



            <!-- rutinas -->

            <section class="seccion-rutinas" id="rutinas">


                <h2>
                    Rutinas Asignadas
                </h2>


                <div class="routine-card-grid" id="memberRoutine"></div>
                <p class="interface-empty" id="noAssignedRoutine" hidden>No tienes una rutina asignada.</p>


            </section>



            <!-- clases grupales -->

            <section class="seccion-clases" id="clases">


                <h2>
                    Próximas clases
                </h2>


                <div class="clases" id="memberClasses" data-member-name="miau"></div>

            </section>

            <section class="seccion-clases" id="resena">
                <h2>Mi reseña</h2>
                <div class="member-review-card" id="memberReview">
                    <p id="memberReviewEmpty" hidden>Todavía no escribiste una reseña.</p>
                    <div id="memberReviewContent" hidden>
                        <p class="member-review-rating" id="memberReviewRating"></p>
                        <p class="member-review-text" id="memberReviewText"></p>
                    </div>
                    <a class="interface-button-secondary" id="memberReviewLink" href="paginas/resenas.html?name=miau&amp;editar=1">Escribir reseña</a>
                </div>
                <p class="interface-feedback" id="memberReviewFeedback" role="status" aria-live="polite"></p>
            </section>


        </main>


    </div>



    <!-- boostrap js -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard/usuario.js"></script>


</body>

</html>
