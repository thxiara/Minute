<!DOCTYPE html>
<html lang="es">

<head>
    <base href="../../../">
    <script>
        const assetFallbackPrefix = '/front/dist/';
        const assetFallbackRoot = document.querySelector('base') ? '' : 'dist/';

        document.addEventListener('error', (event) => {
            const element = event.target;
            if (!(element instanceof Element)) return;

            const attribute = element.hasAttribute('href') ? 'href' : 'src';
            const url = element.getAttribute(attribute);
            if (!url?.startsWith(assetFallbackPrefix)) return;

            const fallbackUrl = assetFallbackRoot + url.slice(assetFallbackPrefix.length);
            if (element instanceof HTMLScriptElement) {
                const replacement = document.createElement('script');
                replacement.src = fallbackUrl;
                element.after(replacement);
                element.remove();
            } else {
                element.setAttribute(attribute, fallbackUrl);
            }
        }, true);
    </script>
    <link rel="icon" type="image/png" href="/front/dist/assets/iconos/favicon.png?v=20261114">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitPower - Usuario</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Fuentes -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&family=TASA+Explorer:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- css -->
    <link rel="stylesheet" href="/front/dist/css/styles.css?v=20261114">
    <link rel="stylesheet" href="/front/dist/css/dashboards/comun.css?v=20261114">

    <link
        rel="stylesheet"
        href="/front/dist/css/dashboards/usuario.css?v=20261114"
    >
    <link rel="stylesheet" href="/front/dist/css/dashboards/interfaces.css?v=20261114">

    <link
        rel="stylesheet"
        href="/front/dist/css/responsives/dashboardsresponsive/comunresponsive.css?v=20261114"
    >

    <link
        rel="stylesheet"
        href="/front/dist/css/responsives/dashboardsresponsive/usuarioresponsive.css?v=20261114"
    >


    <!-- Traducciones: tiene que cargarse antes que el resto de los scripts -->
    <script src="/front/dist/js/i18n.js?v=20261114"></script>
    <link rel="stylesheet" href="/front/dist/css/efectos.css?v=20261114">
    <script src="/front/dist/js/efectos.js?v=20261114"></script>
</head>


<body>

    <div class="container-fluid usuario-page p-0">

        <!-- Encabezado -->
        <header>

            <div class="container-fluid">

                <div class="d-flex justify-content-between align-items-center header-contenido">

                     <h1 class="logo">
                        <a href="/">FitPower</a>
                    </h1>

                    <div class="header-derecha">

                            <span class="header-text" id="memberHeaderName">{{nombre}}</span>

                                <img
                                src="/front/dist/assets/imagenes/img6.jpg?v=20261114" class="usuario-header" alt="Usuario" data-profile-photo>

                            <button
                                class="boton-menu"
                                type="button"
                                data-bs-toggle="offcanvas"
                                data-bs-target="#menuLateral"
                                aria-controls="menuLateral"
                                aria-label="Abrir menú"
                            >
                                <span></span>
                                <span></span>
                                <span></span>
                            </button>

                    </div>

                </div>

            </div>

        </header>

        <!-- menu lateral  -->

        <div
            class="offcanvas offcanvas-end menu-usuario"
            tabindex="-1"
            id="menuLateral"
        >

            <div class="offcanvas-header">

                <h5 class="offcanvas-title">
                    Menú
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="offcanvas"
                    aria-label="Cerrar"
                ></button>

            </div>


            <div class="offcanvas-body">

                <a
                    href="/dash/socio#perfil"
                    class="menu-link"
                >
                    Mi perfil
                </a>


                <a
                    href="/dash/socio#rutinas"
                    class="menu-link"
                >
                    Mis rutinas
                </a>


                <a
                    href="/dash/socio#clases"
                    class="menu-link"
                >
                    Mis clases
                </a>


                <a
                    href="/logout"
                    class="menu-link cerrar"
                >
                    Cerrar sesión
                </a>

            </div>

        </div>




        <!-- Contenido -->
        <main class="usuario-content">


            <!-- presentacion -->

            <section class="presentacion">


                <div class="perfil" id="perfil">

                    <div class="foto-usuario-control">
                        <button type="button" class="foto-usuario-trigger" id="changePhotoButton" aria-label="Cambiar foto de perfil">
                            <img
                                src="/front/dist/assets/imagenes/img6.jpg?v=20261114"
                                alt="Usuario"
                                class="foto-usuario"
                                data-profile-photo
                            >
                            <span>Cambiar foto</span>
                        </button>
                    </div>


                    <h1 id="memberGreeting" data-member-greeting>
                    </h1>


                </div>

		<a href="/logout">
                <button type="button" class="cerrar-sesion">
                    Cerrar sesión
                </button>
		</a>

            </section>



            <!-- linea -->

            <div class="linea"></div>

            <!-- info de membresia -->

            <p id="photoFeedback" class="photo-feedback" role="status" aria-live="polite"></p>

            <section class="informacion-membresia" id="membresia">


                <div class="dato-membresia">

                    <span class="dato-titulo">
                        MEMBRESÍA
                    </span>

                    <span class="dato-valor" id="membershipName">
                        —
                    </span>

                </div>


                <div class="dato-membresia">

                    <span class="dato-titulo">
                        VENCIMIENTO
                    </span>

                    <span class="dato-valor" id="membershipExpiration">
                        —
                    </span>

                </div>


                <div class="dato-membresia">

                    <span class="dato-titulo">
                        MIEMBRO DESDE
                    </span>

                    <span class="dato-valor" id="memberSince">
                        —
                    </span>

                </div>


            </section>

            <p id="membershipExpiryNotice" class="membership-expiry-notice" role="status" hidden></p>



            <!-- rutinas -->

            <section class="seccion-rutinas" id="rutinas">


                <h2>
                    Rutinas Asignadas
                    <span id="routineCount" class="routine-count" aria-live="polite"></span>
                </h2>


                <div class="routine-card-grid" id="memberRoutine"></div>
                <p class="interface-empty" id="noAssignedRoutine" hidden>Todavía no tenés rutinas asignadas.</p>


            </section>



            <!-- clases grupales -->

            <section class="seccion-clases" id="clases">


                <h2>
                    Mis clases
                </h2>


                <div class="clases" id="memberClasses" data-member-name></div>

            </section>

            <section class="seccion-clases" id="resena">
                <h2>Mi reseña</h2>
                <div class="member-review-card" id="memberReview">
                    <p id="memberReviewEmpty" hidden>Todavía no escribiste una reseña.</p>
                    <div id="memberReviewContent" hidden>
                        <p class="member-review-rating" id="memberReviewRating"></p>
                        <p class="member-review-text" id="memberReviewText"></p>
                    </div>
                    <a class="interface-button-secondary" id="memberReviewLink" href="/resenas#memberReviewForm">Escribir reseña</a>
                </div>
                <p class="interface-feedback" id="memberReviewFeedback" role="status" aria-live="polite"></p>
            </section>


        </main>


    </div>




    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/front/dist/js/api.js?v=20261114"></script>
    <script src="/front/dist/js/foto-perfil.js?v=20261114"></script>
    <script src="/front/dist/js/visor-imagen.js?v=20261114"></script>
    <script src="/front/dist/js/dashboard/usuario.js?v=20261114"></script>


</body>

</html>
