<!DOCTYPE html>
<html lang="es">

<head>
    <base href="../../../">
    <script>
        const assetFallbackPrefix = '/front/dist/';
        const assetFallbackRoot = document.querySelector('base') ? '' : 'dist/';

        document.addEventListener('error', (event) => {
            const element = event.target;
            if (!(element instanceof Element)) return;

            const attribute = element.hasAttribute('href') ? 'href' : 'src';
            const url = element.getAttribute(attribute);
            if (!url?.startsWith(assetFallbackPrefix)) return;

            const fallbackUrl = assetFallbackRoot + url.slice(assetFallbackPrefix.length);
            if (element instanceof HTMLScriptElement) {
                const replacement = document.createElement('script');
                replacement.src = fallbackUrl;
                element.after(replacement);
                element.remove();
            } else {
                element.setAttribute(attribute, fallbackUrl);
            }
        }, true);
    </script>
    <link rel="icon" type="image/png" href="/front/dist/assets/iconos/favicon.png">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitPower - Nuevo usuario</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link rel="stylesheet" href="/front/dist/css/styles.css">
    <link rel="stylesheet" href="/front/dist/css/dashboards/comun.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&family=TASA+Explorer:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/front/dist/css/dashboards/adminregistrar.css"
    >

    <link
        rel="stylesheet"
        href="/front/dist/css/dashboards/interfaces.css"
    >

    <link
        rel="stylesheet"
        href="/front/dist/css/responsives/dashboardsresponsive/comunresponsive.css"
    >

    <link
        rel="stylesheet"
        href="/front/dist/css/responsives/dashboardsresponsive/adminregistrarresponsive.css"
    >


    <!-- Traducciones: tiene que cargarse antes que el resto de los scripts -->
    <script src="/front/dist/js/i18n.js"></script>
</head>


<body>

    <div class="container-fluid admin-page p-0">


        <!-- header -->

        <header class="admin-header">

            <div class="container-fluid h-100">

                <div class="row h-100 align-items-center">

                    <div class="col">

                        <div class="logo">
                            <a href="/">FitPower</a>
                        </div>

                    </div>


                    <div class="col-auto">

                        <div class="admin-header-profile d-flex align-items-center">

                            <span class="nombre-usuario">{{nombre}}</span>


                            <img
                                src="/front/dist/assets/imagenes/img6.jpg"
                                alt="Usuario"
                                class="imagen-usuario"
                            >


                            <button
                                class="boton-menu"
                                type="button"
                                data-bs-toggle="offcanvas"
                                data-bs-target="#menuLateral"
                                aria-controls="menuLateral"
                            >

                                <span></span>
                                <span></span>
                                <span></span>

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </header>



        <!-- contenido -->

        <div class="row g-0 admin-content">


            <!-- barra-lateral desktop -->

            <aside class="col-md-auto barra-lateral d-none d-md-block">

                <div class="seccion-barra-lateral">


                    <div class="titulo-barra-lateral">

                        <span>
                            Socios
                        </span>


                        <button
                            class="boton-flecha"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#sociosMenu"
                            aria-expanded="true"
                        >
                            V
                        </button>

                    </div>


                    <div
                        class="collapse show"
                        id="sociosMenu"
                    >

                        <a
                            href="/dash/admin/registrar#"
                            class="enlace-barra-lateral activo"
                        >
                            Nuevo socio
                        </a>


                        <a
                            href="/dash/admin"
                            class="enlace-barra-lateral"
                        >
                            Socios activos
                        </a>

                    </div>

                </div>

                <a href="/dash/admin/clases" class="enlace-barra-lateral">Administrar clases</a>

                <div class="seccion-barra-lateral">


                    <div class="titulo-barra-lateral">

                        <span>
                            Productos
                        </span>


                        <button
                            class="boton-flecha"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#productosMenu"
                            aria-expanded="false"
                        >
                            &lt;
                        </button>

                    </div>


                    <div
                        class="collapse"
                        id="productosMenu"
                    >

                        <a
                            href="/dash/admin/producto"
                            class="enlace-barra-lateral"
                        >
                            Nuevo producto
                        </a>


                        <a
                            href="/dash/admin/productos"
                            class="enlace-barra-lateral"
                        >
                            Productos activos
                        </a>

                    </div>

                </div>

                <a href="/logout" class="enlace-barra-lateral cerrar">Cerrar sesión</a>

            </aside>



            <!-- menu movil -->

            <div
                class="offcanvas offcanvas-start barra-lateral-movil"
                tabindex="-1"
                id="menuLateral"
            >

                <div class="offcanvas-body">

                    <div class="seccion-barra-lateral">


                        <div class="titulo-barra-lateral">

                            <span>
                                Socios
                            </span>


                            <button
                                class="boton-flecha"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#sociosMobile"
                                aria-expanded="true"
                            >
                                V
                            </button>

                        </div>


                        <div
                            class="collapse show"
                            id="sociosMobile"
                        >

                            <a
                                href="/dash/admin/registrar"
                                class="enlace-barra-lateral activo"
                            >
                                Nuevo socio
                            </a>


                            <a
                                href="/dash/admin"
                                class="enlace-barra-lateral"
                            >
                                Socios activos
                            </a>

                        </div>

                    </div>

                    <a href="/dash/admin/clases" class="enlace-barra-lateral">Administrar clases</a>


                    <div class="seccion-barra-lateral">


                        <div class="titulo-barra-lateral">

                            <span>
                                Productos
                            </span>


                            <button
                                class="boton-flecha"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#productosMobile"
                                aria-expanded="false"
                            >
                                &lt;
                            </button>

                        </div>


                        <div
                            class="collapse"
                            id="productosMobile"
                        >

                            <a
                                href="/dash/admin/producto"
                                class="enlace-barra-lateral"
                            >
                                Nuevo producto
                            </a>


                            <a
                                href="/dash/admin/productos"
                                class="enlace-barra-lateral"
                            >
                                Productos activos
                            </a>

                        </div>

                    </div>

                    <a href="/logout" class="enlace-barra-lateral cerrar">Cerrar sesión</a>

                </div>

            </div>



            <!-- contenido principal -->

            <main class="col main-content registrar-content">


                <div class="registro-container">


                    <h1 id="formTitle">
                        Nuevo usuario
                    </h1>


                    <div class="form-line"></div>


                    <form id="registrarSocioForm">

                        <div id="alertContainer"></div>


                        <div class="row">

                            <div class="col-md-4 campo">

                                <label for="tipo">
                                    Tipo de usuario *
                                </label>

                                <select id="tipo" name="tipo" required>
                                    <option value="" selected disabled>Selecciona un tipo</option>
                                    <option value="socio">Socio</option>
                                    <option value="profesor">Profesor</option>
                                    <option value="entrenador">Entrenador</option>
                                    <option value="admin">Admin</option>
                                </select>

                            </div>


                            <div class="col-md-4 campo">

                                <label for="nombre">
                                    Nombre y apellido *
                                </label>


                                <input
                                    type="text"
                                    id="nombre"
                                    name="nombre"
                                    maxlength="30"
                                    required
                                >

                            </div>



                            <div class="col-md-4 campo">

                                <label for="ci">
                                    C.I *
                                </label>


                                <input
                                    type="text"
                                    id="ci"
                                    name="ci"
                                    maxlength="20"
                                    required
                                >

                            </div>



                            <div class="col-md-4 campo">

                                <label for="telefono">
                                    Teléfono *
                                </label>


                                <input
                                    type="text"
                                    id="telefono"
                                    name="telefono"
                                    maxlength="20" inputmode="tel"
                                    required
                                >

                            </div>

                        </div>



                        <div class="row">


                            <div class="col-md-4 campo">

                                <label for="email">
                                    E-mail *
                                </label>


                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    maxlength="50"
                                    required
                                >

                            </div>



                            <div class="col-md-4 campo">

                                <label for="fecha">
                                    Fecha de nacimiento *
                                </label>


                                <input
                                    type="date"
                                    id="fecha"
                                    name="fecha"
                                >

                            </div>



                            <div class="col-md-4 campo" id="campoPlan" hidden>

                                <label for="plan" id="membershipLabel">
                                    Membresía *
                                </label>

                                <select id="plan" name="plan">
                                    <option value="">Selecciona una opción</option>
                                    <option value="basico">Básico</option>
                                    <option value="pro">Pro</option>
                                    <option value="premium">Premium</option>
                                </select>

                            </div>

                        </div>



                        <div class="row">


                            <div class="col-md-4 campo">

                                <label for="contrasena">
                                    Contraseña *
                                </label>


                                <input
                                    type="password"
                                    id="contrasena"
                                    name="contrasena"
                                    minlength="8" maxlength="50" autocomplete="new-password"
                                    required
                                >

                            </div>

                        </div>



                        <div class="form-line form-line-final"></div>



                        <div class="form-buttons">


                            <button
                                type="button"
                                class="btn-cancelar"
                            >
                                Cancelar
                            </button>


                            <button
                                type="submit"
                                class="btn-guardar"
                            >
                                Guardar
                            </button>

                        </div>


                    </form>

                </div>


            </main>


        </div>

    </div>



    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="/front/dist/js/api.js"></script>
    <script src="/front/dist/js/dashboard/admin.js"></script>

</body>

</html>
