<!DOCTYPE html>
<html lang="es">

<head>
    <base href="../../../">
    <script>
        const assetFallbackPrefix = '/front/dist/';
        const assetFallbackRoot = document.querySelector('base') ? '' : 'dist/';

        document.addEventListener('error', (event) => {
            const element = event.target;
            if (!(element instanceof Element)) return;

            const attribute = element.hasAttribute('href') ? 'href' : 'src';
            const url = element.getAttribute(attribute);
            if (!url?.startsWith(assetFallbackPrefix)) return;

            const fallbackUrl = assetFallbackRoot + url.slice(assetFallbackPrefix.length);
            if (element instanceof HTMLScriptElement) {
                const replacement = document.createElement('script');
                replacement.src = fallbackUrl;
                element.after(replacement);
                element.remove();
            } else {
                element.setAttribute(attribute, fallbackUrl);
            }
        }, true);
    </script>
    <link rel="icon" type="image/png" href="/front/dist/assets/iconos/favicon.png">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitPower - Nuevo usuario</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link rel="stylesheet" href="/front/dist/css/styles.css">
    <link rel="stylesheet" href="/front/dist/css/dashboards/comun.css">
    <link rel="stylesheet" href="/front/dist/css/dashboards/interfaces.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&family=TASA+Explorer:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/front/dist/css/dashboards/adminregistrar.css"
    >

    <link
        rel="stylesheet"
        href="/front/dist/css/responsives/dashboardsresponsive/comunresponsive.css"
    >

    <link
        rel="stylesheet"
        href="/front/dist/css/responsives/dashboardsresponsive/adminregistrarresponsive.css"
    >


    <!-- Traducciones: tiene que cargarse antes que el resto de los scripts -->
    <script src="/front/dist/js/i18n.js"></script>
</head>


<body class="interface-page admin-interface">

    <!-- header -->

    <header>
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center header-contenido">
                <h1 class="logo"><a href="/">FitPower</a></h1>
                <div class="header-derecha">
                    <span class="header-text">{{nombre}}</span>
                    <img src="/front/dist/assets/imagenes/img6.jpg" class="usuario-header" alt="Foto de perfil">
                    <button class="boton-menu role-nav-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#roleNavigation" aria-controls="roleNavigation" aria-label="Abrir navegación">
                        <span></span><span></span><span></span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="interface-layout">

        <aside class="interface-sidebar offcanvas offcanvas-start" id="roleNavigation" tabindex="-1" aria-labelledby="roleNavigationTitle">
            <div class="offcanvas-header d-lg-none">
                <h2 class="offcanvas-title" id="roleNavigationTitle">Administración</h2>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
            </div>
            <div class="offcanvas-body">
                <nav aria-label="Navegación de administración">
                    <div class="interface-nav-group">
                        <h3>Usuarios</h3>
                        <a href="/dash/admin">Usuarios activos</a>
                        <a href="/dash/admin/registrar" aria-current="page">Nuevo usuario</a>
                    </div>
                    <div class="interface-nav-group">
                        <h3>Clases</h3>
                        <a href="/dash/admin/clases">Administrar clases</a>
                    </div>
                    <div class="interface-nav-group">
                        <h3>Productos</h3>
                        <a href="/dash/admin/productos">Productos activos</a>
                        <a href="/dash/admin/producto">Nuevo producto</a>
                    </div>
                    <div class="interface-nav-group">
                        <h3>Reseñas</h3>
                        <a href="/dash/admin/resenas">Reseñas</a>
                    </div>
                    <a href="/logout" class="cerrar">Cerrar sesión</a>
                </nav>
            </div>
        </aside>

        <main class="interface-content">

            <!-- titulo principal -->

            <div class="interface-heading">
                <div>
                    <span class="interface-eyebrow">Administración</span>
                    <h1 id="formTitle">Nuevo usuario</h1>
                </div>
            </div>

            <!-- formulario -->

            <section class="interface-panel registro-panel">
                <div class="interface-panel-header">
                    <h2>Datos del usuario</h2>
                </div>
                <div class="interface-panel-body">

                    <form id="registrarSocioForm">

                        <div id="alertContainer"></div>


                        <div class="row">

                            <div class="col-md-4 campo">

                                <label for="tipo">
                                    Tipo de usuario *
                                </label>

                                <select id="tipo" name="tipo" required>
                                    <option value="" selected disabled>Selecciona un tipo</option>
                                    <option value="socio">Socio</option>
                                    <option value="profesor">Profesor</option>
                                    <option value="entrenador">Entrenador</option>
                                    <option value="admin">Admin</option>
                                </select>

                            </div>


                            <div class="col-md-4 campo">

                                <label for="nombre">
                                    Nombre y apellido *
                                </label>


                                <input
                                    type="text"
                                    id="nombre"
                                    name="nombre"
                                    maxlength="30"
                                    required
                                >

                            </div>



                            <div class="col-md-4 campo">

                                <label for="ci">
                                    C.I *
                                </label>


                                <input
                                    type="text"
                                    id="ci"
                                    name="ci"
                                    maxlength="20"
                                    required
                                >

                            </div>



                            <div class="col-md-4 campo">

                                <label for="telefono">
                                    Teléfono *
                                </label>


                                <input
                                    type="text"
                                    id="telefono"
                                    name="telefono"
                                    maxlength="20" inputmode="tel"
                                    required
                                >

                            </div>

                        </div>



                        <div class="row">


                            <div class="col-md-4 campo">

                                <label for="email">
                                    E-mail *
                                </label>


                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    maxlength="50"
                                    required
                                >

                            </div>



                            <div class="col-md-4 campo">

                                <label for="fecha">
                                    Fecha de nacimiento *
                                </label>


                                <input
                                    type="date"
                                    id="fecha"
                                    name="fecha"
                                >

                            </div>



                            <div class="col-md-4 campo" id="campoPlan" hidden>

                                <label for="plan" id="membershipLabel">
                                    Membresía *
                                </label>

                                <select id="plan" name="plan">
                                    <option value="">Selecciona una opción</option>
                                    <option value="basico">Básico</option>
                                    <option value="pro">Pro</option>
                                    <option value="premium">Premium</option>
                                </select>

                            </div>

                        </div>



                        <div class="row">


                            <div class="col-md-4 campo">

                                <label for="contrasena">
                                    Contraseña *
                                </label>


                                <input
                                    type="password"
                                    id="contrasena"
                                    name="contrasena"
                                    minlength="8" maxlength="50" autocomplete="new-password"
                                    required
                                >

                            </div>

                        </div>



                        <div class="form-buttons">


                            <button
                                type="button"
                                class="btn-cancelar"
                            >
                                Cancelar
                            </button>


                            <button
                                type="submit"
                                class="btn-guardar"
                            >
                                Guardar
                            </button>

                        </div>


                    </form>

                </div>
            </section>


        </main>


    </div>



    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="/front/dist/js/api.js"></script>
    <script src="/front/dist/js/foto-perfil.js"></script>
    <script src="/front/dist/js/visor-imagen.js"></script>
    <script src="/front/dist/js/dashboard/admin.js"></script>

</body>

</html>
