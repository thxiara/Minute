<!DOCTYPE html>
<html lang="es">

<head>
    <base href="../">
    <script>
        const assetFallbackPrefix = '/front/dist/';
        const assetFallbackRoot = document.querySelector('base') ? '' : 'dist/';

        document.addEventListener('error', (event) => {
            const element = event.target;
            if (!(element instanceof Element)) return;

            const attribute = element.hasAttribute('href') ? 'href' : 'src';
            const url = element.getAttribute(attribute);
            if (!url?.startsWith(assetFallbackPrefix)) return;

            const fallbackUrl = assetFallbackRoot + url.slice(assetFallbackPrefix.length);
            if (element instanceof HTMLScriptElement) {
                const replacement = document.createElement('script');
                replacement.src = fallbackUrl;
                element.after(replacement);
                element.remove();
            } else {
                element.setAttribute(attribute, fallbackUrl);
            }
        }, true);
    </script>
    <link rel="icon" type="image/png" href="/front/dist/assets/iconos/favicon.png?v=20261113">

<body data-es-socio="{{es_socio}}">


<a href="/" class="volver">

    <i class="fa-solid fa-arrow-left"></i>
    Volver al inicio

</a>



<!-- Contenido -->
<div class="container py-5 reviews">


    <div class="row mb-5">

        <div class="col-12 text-center">

            <h1>Reseñas</h1>

            <p class="subtitulo">

                Conoce las experiencias de quienes entrenan diariamente en FitPower.

            </p>

        </div>

    </div>



    <div class="row g-4" id="reviewsList" aria-live="polite">
        <p class="text-center">Cargando reseñas…</p>
    </div>

    <div class="row justify-content-center mt-5">

        <div class="col-12 col-lg-8">

            <p class="text-center" id="reviewLoginHint" hidden>
                <a href="/login">Iniciá sesión</a> como socio para escribir tu reseña.
            </p>
            <form class="formulario" id="memberReviewForm" hidden>

                <h2 id="reviewFormHeading">Escribe tu reseña</h2>



                <div class="mb-3">

                    <select class="form-control" id="reviewRating" name="rating" required>

                        <option value="" selected disabled>
                            Selecciona una calificación
                        </option>

                        <option value="5">★★★★★</option>
                        <option value="4">★★★★☆</option>
                        <option value="3">★★★☆☆</option>
                        <option value="2">★★☆☆☆</option>
                        <option value="1">★☆☆☆☆</option>

                    </select>

                </div>



                <div class="mb-3">

                    <textarea
                    class="form-control"
                    id="reviewText"
                    maxlength="300"
                    name="text"
                    rows="5"
                    placeholder="Comparte tu experiencia en FitPower..."
                    required></textarea>

                </div>



                <p id="reviewFeedback" class="review-feedback" role="status" aria-live="polite"></p>
                <button type="submit" id="reviewSubmit">

                    Publicar reseña

                </button>

            </form>

        </div>

    </div>


</div>
