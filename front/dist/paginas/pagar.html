<!DOCTYPE html>
<html lang="es">

<head>
    <base href="../">
    <script>
        const assetFallbackPrefix = '/front/dist/';
        const assetFallbackRoot = document.querySelector('base') ? '' : 'dist/';

        document.addEventListener('error', (event) => {
            const element = event.target;
            if (!(element instanceof Element)) return;

            const attribute = element.hasAttribute('href') ? 'href' : 'src';
            const url = element.getAttribute(attribute);
            if (!url?.startsWith(assetFallbackPrefix)) return;

            const fallbackUrl = assetFallbackRoot + url.slice(assetFallbackPrefix.length);
            if (element instanceof HTMLScriptElement) {
                const replacement = document.createElement('script');
                replacement.src = fallbackUrl;
                element.after(replacement);
                element.remove();
            } else {
                element.setAttribute(attribute, fallbackUrl);
            }
        }, true);
    </script>
    <link rel="icon" type="image/png" href="/front/dist/assets/iconos/favicon.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pagar | FitPower</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/front/dist/css/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&family=TASA+Explorer:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            background:var(--color-background);
            display:flex;
            justify-content:center;
            align-items:center;
            color:var(--color-text);
            font-family:'TASA Explorer',sans-serif;
        }

        h1{
            font-family:'Pervitina Dex',sans-serif;
            font-size:28px;
        }

        .btn-back,
        .btn-pay{
            font-family:'TASA Explorer',sans-serif;
        }

        .subtitle{
            font-family:'Special Gothic Expanded One',sans-serif;
        }

        .form-label,
        .form-control,
        .form-select,
        .form-check-label,
        .details,
        .number,
        span{
            font-family:'TASA Explorer',sans-serif;
        }

        .payment-box{
            width:min(100%,420px);
            background:var(--color-background);
            padding:35px;
            border-radius:20px;
            box-shadow:0 0 35px color-mix(in srgb, var(--color-primary) 80%, transparent);
            border:1px solid var(--color-surface);
        }

        .btn-back{
            display:block;
            width:100%;
            text-align:center;
            padding:12px;
            margin-bottom:20px;
            border-radius:12px;
            background:var(--color-surface);
            border:1px solid var(--color-surface-raised);
            color:var(--color-text);
            text-decoration:none;
            font-size:14px;
            transition:.3s;
        }

        .btn-back:hover{
            background:var(--color-surface-raised);
            color:var(--color-text);
        }

        .subtitle{
            color:var(--color-accent-bright);
            font-size:14px;
        }

        .card{
            height:190px;
            border-radius:18px;
            padding:25px;
            background:linear-gradient(135deg,var(--color-primary),var(--color-accent));
            box-shadow:inset 0 0 20px color-mix(in srgb, var(--color-text) 5%, transparent);
        }

        .chip{
            width:45px;
            height:32px;
            background:var(--color-accent-bright);
            border-radius:6px;
            margin-bottom:25px;
        }

        .number{
            font-size:22px;
            letter-spacing:3px;
            margin-bottom:25px;
            color:var(--color-text);
        }

        .details{
            color:var(--color-accent-bright);
            font-size:13px;
        }

        .form-label{
            color:var(--color-text-secondary);
            font-size:14px;
        }

        .form-control,
        .form-select{
            background:var(--color-surface);
            border:1px solid var(--color-surface-raised);
            color:var(--color-text);
            padding:14px;
            border-radius:10px;
        }

        .form-control:focus,
        .form-select:focus{
            background:var(--color-surface);
            color:var(--color-text);
            border-color:var(--color-primary);
            box-shadow:none;
        }

        .form-select option{
            background:var(--color-background);
        }

        .form-check-input{
            background-color:var(--color-surface-raised);
            border-color:var(--color-text-secondary);
        }

        .form-check-input:checked{
            background-color:var(--color-text);
            border-color:var(--color-text);
        }

        .form-check-label{
            color:var(--color-accent-bright);
            font-size:13px;
        }

        .btn-pay{
            background:var(--color-text);
            color:var(--color-background);
            border:none;
            padding:15px;
            border-radius:12px;
            font-weight:bold;
            transition:.3s;
        }

        .btn-pay:hover{
            background:var(--color-surface-raised);
            color:var(--color-text);
            transform:translateY(-2px);
        }

        @media(max-width:500px){

            body{
                align-items:flex-start;
                padding:16px 0;
            }

            .payment-box{
                width:100%;
                padding:22px;
            }

            .card{
                height:auto;
                min-height:170px;
                padding:20px;
            }

            .number{
                font-size:clamp(15px,5vw,18px);
                letter-spacing:2px;
            }

        }

        body{
            background:
                radial-gradient(ellipse at 18% 0,color-mix(in srgb, var(--color-accent) 20%, transparent),transparent 30rem),
                radial-gradient(ellipse at 100% 90%,color-mix(in srgb, var(--color-accent) 16%, transparent),transparent 28rem),
                var(--color-background);
        }

        h1{
            font-family:'Special Gothic Expanded One',sans-serif;
            font-size:30px;
            font-weight:400;
            color:var(--color-text-secondary);
        }

        .payment-box{
            background:linear-gradient(145deg,var(--color-surface-raised),var(--color-surface));
            border-color:color-mix(in srgb, var(--color-accent) 16%, transparent);
            box-shadow:0 24px 60px var(--color-shadow),0 0 36px color-mix(in srgb, var(--color-accent) 10%, transparent);
        }

        .btn-back{
            border-color:color-mix(in srgb, var(--color-accent) 18%, transparent);
            color:var(--color-text-secondary);
        }

        .btn-back:hover{
            background:var(--color-primary-deep);
        }

        .card{
            background:linear-gradient(135deg,var(--color-primary-deep),var(--color-primary));
            box-shadow:inset 0 0 24px color-mix(in srgb, var(--color-text) 8%, transparent),0 12px 25px var(--color-shadow);
        }

        .number{
            color:var(--color-text);
        }

        .form-control,
        .form-select{
            border-color:color-mix(in srgb, var(--color-accent) 20%, transparent);
            background:var(--color-surface-raised);
        }

        .form-control:focus,
        .form-select:focus{
            border-color:var(--color-accent-bright);
            box-shadow:0 0 0 3px color-mix(in srgb, var(--color-accent) 17%, transparent);
        }

        .btn-pay{
            background:linear-gradient(135deg,var(--color-primary-deep),var(--color-primary));
            color:var(--color-text);
            box-shadow:0 9px 22px color-mix(in srgb, var(--color-accent) 25%, transparent);
        }

        .btn-pay:hover{
            background:linear-gradient(135deg,var(--color-accent-bright),var(--color-primary));
            color:var(--color-text);
        }

    </style>

    <!-- Traducciones: tiene que cargarse antes que el resto de los scripts -->
    <script src="/front/dist/js/i18n.js"></script>
</head>


<body>


<div class="container">


    <div class="payment-box mx-auto">


        <a href="/" class="btn-back">

            Volver al inicio

        </a>


        <h1 class="text-center mb-2">

            Realizar pago

        </h1>


        <p class="subtitle text-center mb-4">

            Ingresa los datos de tu tarjeta para completar la compra

        </p>


        <div class="card mb-4">


            <div class="chip"></div>


            <div class="number">

                **** **** **** 1234

            </div>


            <div class="details d-flex justify-content-between">

                <span>NOMBRE TITULAR</span>

                <span>MM/AA</span>

            </div>


        </div>


        <form>


            <div class="mb-3">


                <label class="form-label">

                    Tipo de tarjeta

                </label>


                <select class="form-select">


                    <option selected>

                        Selecciona tu tarjeta

                    </option>


                    <option>

                        Visa

                    </option>


                    <option>

                        Mastercard

                    </option>


                    <option>

                        American Express

                    </option>


                    <option>

                        Otra

                    </option>


                </select>


            </div>


            <div class="mb-3">


                <label class="form-label">

                    Número de tarjeta

                </label>


                <input
                    type="text"
                    class="form-control"
                    maxlength="19"
                    inputmode="numeric"
                    autocomplete="cc-number"
                    placeholder="1234 5678 9012 3456">


            </div>


            <div class="mb-3">


                <label class="form-label">

                    Nombre del titular

                </label>


                <input
                    type="text"
                    class="form-control"
                    maxlength="30"
                    autocomplete="cc-name"
                    placeholder="Nombre completo">


            </div>


            <div class="row g-3">


                <div class="col-7">


                    <label class="form-label">

                        Vencimiento

                    </label>


                    <input
                        type="text"
                        class="form-control"
                        maxlength="5"
                        autocomplete="cc-exp"
                        placeholder="MM/AA">


                </div>


                <div class="col-5">


                    <label class="form-label">

                        CVV

                    </label>


                    <input
                        type="password"
                        class="form-control"
                        maxlength="4"
                        inputmode="numeric"
                        autocomplete="cc-csc"
                        placeholder="123">


                </div>


            </div>


            <div class="form-check mt-4 mb-4">


                <input
                    class="form-check-input"
                    type="checkbox"
                    id="aceptar">


                <label
                    class="form-check-label"
                    for="aceptar">

                    Confirmo que los datos ingresados son correctos y acepto ser responsable de esta compra.

                </label>


            </div>


            <button class="btn btn-pay w-100">

                Confirmar compra

            </button>


        </form>


    </div>


</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
