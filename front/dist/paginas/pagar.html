<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pagar | FitPower</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Phudu:wght@400;500;600;700&family=Ancizar+Sans:wght@400;500;600;700&family=Andada+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            background:#080808;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-family:'Andada Pro',serif;
        }

        h1{
            font-family:'Phudu',cursive;
            font-size:28px;
        }

        .btn-back,
        .btn-pay{
            font-family:'Ancizar Sans',sans-serif;
        }

        .subtitle,
        .form-label,
        .form-control,
        .form-select,
        .form-check-label,
        .details,
        .number,
        span{
            font-family:'Andada Pro',serif;
        }

        .payment-box{
            width:420px;
            background:#111;
            padding:35px;
            border-radius:20px;
            box-shadow:0 0 35px rgba(71,71,71,.8);
            border:1px solid #222;
        }

        .btn-back{
            display:block;
            width:100%;
            text-align:center;
            padding:12px;
            margin-bottom:20px;
            border-radius:12px;
            background:#191919;
            border:1px solid #333;
            color:white;
            text-decoration:none;
            font-size:14px;
            transition:.3s;
        }

        .btn-back:hover{
            background:#333;
            color:white;
        }

        .subtitle{
            color:#999;
            font-size:14px;
        }

        .card{
            height:190px;
            border-radius:18px;
            padding:25px;
            background:linear-gradient(135deg,#1b1b1b,#333);
            box-shadow:inset 0 0 20px rgba(255,255,255,.05);
        }

        .chip{
            width:45px;
            height:32px;
            background:#c9a85c;
            border-radius:6px;
            margin-bottom:25px;
        }

        .number{
            font-size:22px;
            letter-spacing:3px;
            margin-bottom:25px;
            color:#bbb;
        }

        .details{
            color:#aaa;
            font-size:13px;
        }

        .form-label{
            color:#bbb;
            font-size:14px;
        }

        .form-control,
        .form-select{
            background:#191919;
            border:1px solid #333;
            color:white;
            padding:14px;
            border-radius:10px;
        }

        .form-control:focus,
        .form-select:focus{
            background:#191919;
            color:white;
            border-color:#777;
            box-shadow:none;
        }

        .form-select option{
            background:#111;
        }

        .form-check-input{
            background-color:#191919;
            border-color:#555;
        }

        .form-check-input:checked{
            background-color:white;
            border-color:white;
        }
                .form-check-label{
            color:#aaa;
            font-size:13px;
        }

        .btn-pay{
            background:white;
            color:black;
            border:none;
            padding:15px;
            border-radius:12px;
            font-weight:bold;
            transition:.3s;
        }

        .btn-pay:hover{
            background:#ddd;
            color:black;
            transform:translateY(-2px);
        }

        @media(max-width:500px){

            .payment-box{
                width:90%;
                padding:25px;
            }

            .card{
                height:auto;
            }

            .number{
                font-size:18px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="payment-box mx-auto">

        <a href="../../index.html" class="btn-back">
            Volver al inicio
        </a>

        <h1 class="text-center mb-2">
            Realizar pago
        </h1>

        <p class="subtitle text-center mb-4">
            Ingresa los datos de tu tarjeta para completar la compra
        </p>

        <div class="card mb-4">

            <div class="chip"></div>

            <div class="number">
                **** **** **** 1234
            </div>

            <div class="details d-flex justify-content-between">
                <span>NOMBRE TITULAR</span>
                <span>MM/AA</span>
            </div>

        </div>

        <form>

            <div class="mb-3">

                <label class="form-label">
                    Tipo de tarjeta
                </label>

                <select class="form-select">

                    <option selected>
                        Selecciona tu tarjeta
                    </option>

                    <option>
                        Visa
                    </option>

                    <option>
                        Mastercard
                    </option>

                    <option>
                        American Express
                    </option>

                    <option>
                        Otra
                    </option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Número de tarjeta
                </label>

                <input
                    type="text"
                    class="form-control"
                    placeholder="1234 5678 9012 3456">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Nombre del titular
                </label>

                <input
                    type="text"
                    class="form-control"
                    placeholder="Nombre completo">

            </div>
                        <div class="row g-3">

                <div class="col-7">

                    <label class="form-label">
                        Vencimiento
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        placeholder="MM/AA">

                </div>

                <div class="col-5">

                    <label class="form-label">
                        CVV
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        placeholder="123">

                </div>

            </div>

            <div class="form-check mt-4 mb-4">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="aceptar">

                <label
                    class="form-check-label"
                    for="aceptar">

                    Confirmo que los datos ingresados son correctos y acepto ser responsable de esta compra.

                </label>

            </div>

            <button class="btn btn-pay w-100">

                Confirmar compra

            </button>

        </form>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
