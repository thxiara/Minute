<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iniciar Sesión | FitPower</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/auth.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Phudu:wght@400;500;600;700&family=Ancizar+Sans:wght@400;500;600;700&family=Andada+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>


<body>


<a href="../../index.html" class="volver">

    <i class="fa-solid fa-arrow-left"></i>
    Volver al inicio

</a>



<div class="container-fluid contenedor">


    <img src="../assets/imágenes/img4.jpg" class="fondo" alt="Fondo">



    <div class="row min-vh-100 justify-content-center align-items-center">


        <div class="col-11 col-sm-10 col-md-8 col-lg-5 col-xl-4">


            <form class="formulario">


                <h1>Iniciar Sesión</h1>


                <div class="mb-3">

                    <input 
                    type="email"
                    class="form-control"
                    placeholder="Correo electrónico"
                    required>

                </div>



                <div class="mb-3">

                    <input 
                    type="password"
                    class="form-control"
                    placeholder="Contraseña"
                    required>

                </div>



                <button type="submit">

                    Ingresar

                </button>



                <a href="registro.html">

                    ¿No tienes cuenta? Regístrate

                </a>



            </form>


        </div>


    </div>


</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
