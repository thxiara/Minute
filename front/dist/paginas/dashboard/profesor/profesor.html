<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitPower - Vista Profesor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&family=TASA+Explorer:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../../../css/dashboards/profesor.css"
    >

    <link
        rel="stylesheet"
        href="../../../css/responsives/dashboardsresponsive/profesorresponsive.css"
    >

</head>


<body>

    <div class="container-fluid profesor-page p-0">

        <header class="profesor-header">

            <div class="container-fluid h-100">

                <div class="row h-100 align-items-center">

                    <div class="col">

                        <div class="logo">
                            FitPower
                        </div>

                    </div>


                    <div class="col-auto">

                        <div class="usuario-header d-flex align-items-center">

                            <span class="nombre-usuario">
                                Nombre Apellido
                            </span>

                            <img src="../../../assets/imágenes/img6.jpg" alt="Usuario" class="imagen-usuario">

                            <button
                                class="boton-menu"
                                type="button"
                                data-bs-toggle="offcanvas"
                                data-bs-target="#menuLateral"
                                aria-controls="menuLateral"
                            >

                                <span></span>
                                <span></span>
                                <span></span>

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </header>


        <div class="row g-0 profesor-content">


            <aside class="col-md-auto sidebar d-none d-md-block">

                <div class="sidebar-section">

                    <div class="sidebar-title">

                        <span>
                            Alumnos
                        </span>

                        <button
                            class="arrow-button"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#alumnosMenu"
                            aria-expanded="true"
                        >
                            V
                        </button>

                    </div>


                    <div
                        class="collapse show"
                        id="alumnosMenu"
                    >

                        <a
                            href="#"
                            class="sidebar-link activo"
                        >
                            Socios activos
                        </a>

                    </div>

                </div>


                <div class="sidebar-section">

                    <div class="sidebar-title">

                        <span>
                            Clases
                        </span>

                        <button
                            class="arrow-button"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#clasesMenu"
                            aria-expanded="false"
                        >
                            &lt;
                        </button>

                    </div>


                    <div
                        class="collapse"
                        id="clasesMenu"
                    >

                        <a
                            href="#"
                            class="sidebar-link"
                        >
                            Mis clases
                        </a>

                        <a
                            href="#"
                            class="sidebar-link"
                        >
                            Horarios
                        </a>

                    </div>

                </div>

            </aside>


            <div
                class="offcanvas offcanvas-start sidebar-mobile"
                tabindex="-1"
                id="menuLateral"
            >

                <div class="offcanvas-body">

                    <div class="sidebar-section">

                        <div class="sidebar-title">

                            <span>
                                Alumnos
                            </span>

                            <button
                                class="arrow-button"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#alumnosMobile"
                                aria-expanded="true"
                            >
                                V
                            </button>

                        </div>


                        <div
                            class="collapse show"
                            id="alumnosMobile"
                        >

                            <a
                                href="#"
                                class="sidebar-link activo"
                            >
                                Socios activos
                            </a>

                        </div>

                    </div>


                    <div class="sidebar-section">

                        <div class="sidebar-title">

                            <span>
                                Clases
                            </span>

                            <button
                                class="arrow-button"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#clasesMobile"
                                aria-expanded="false"
                            >
                                &lt;
                            </button>

                        </div>


                        <div
                            class="collapse"
                            id="clasesMobile"
                        >

                            <a
                                href="#"
                                class="sidebar-link"
                            >
                                Mis clases
                            </a>

                            <a
                                href="#"
                                class="sidebar-link"
                            >
                                Horarios
                            </a>

                        </div>

                    </div>

                </div>

            </div>


            <main class="col main-content">

                <div class="content-title">

                    <h1>
                        Alumnos Activos
                    </h1>

                </div>


                <div class="students-container">


                    <div class="d-flex justify-content-between align-items-center table-top">

                        <div class="registros">

                            Mostrar

                            <select>

                                <option>
                                    25
                                </option>

                                <option>
                                    10
                                </option>

                                <option>
                                    50
                                </option>

                            </select>

                            registros

                        </div>


                        <div class="search">

                            <input
                                type="text"
                                aria-label="Buscar"
                            >

                            <button
                                type="button"
                                aria-label="Buscar"
                            >
                                ⌕
                            </button>

                        </div>

                    </div>


                    <div class="table-responsive">

                        <table class="table tabla-alumnos">

                            <thead>

                                <tr>

                                    <th>
                                        Nombre
                                    </th>

                                    <th>
                                        Cel.
                                    </th>

                                    <th>
                                        Desempeño(Mes)
                                    </th>

                                    <th>
                                        Nota
                                    </th>

                                    <th class="text-end">
                                        Acciones
                                    </th>

                                </tr>

                            </thead>


                            <tbody>

                                <tr>

                                    <td></td>
                                    <td></td>

                                    <td></td>
                                    <td></td>

                                    <td></td>
                                    <td></td>

                                    <td class="nota">

                                    <td class="nota">

                                        <button type="button" class="leer-mas">
                                            leer más
                                            leer más
                                        </button>

                                    </td>

                                    </td>

                                    <td class="acciones">

                                        <button
                                            type="button"
                                            class="action-button"
                                        >
                                            ⋮
                                        </button>


                                        <div class="action-menu">

                                            <button type="button">

                                                <span class="icono-ver">
                                                    ●
                                                </span>

                                                Ver perfil

                                            </button>


                                            <button type="button">

                                                <span class="icono-evaluacion">
                                                    ◆
                                                </span>

                                                Dar evaluación

                                            </button>

                                        </div>

                                    </td>

                                </tr>


                                <tr>

                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>

                                    <td class="acciones">

                                        <button
                                            type="button"
                                            class="action-button"
                                        >
                                            ⋮
                                        </button>


                                        <div class="action-menu">

                                            <button type="button">

                                                <span class="icono-ver">
                                                    ●
                                                </span>

                                                Ver perfil

                                            </button>


                                            <button type="button">

                                                <span class="icono-evaluacion">
                                                    ◆
                                                </span>

                                                Dar evaluación

                                            </button>

                                        </div>

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>


                    <div class="pagination">

                        <button type="button">
                            ←
                        </button>

                        <button type="button">
                            →
                        </button>

                    </div>

                </div>

            </main>

        </div>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <script src="../../../js/dashboard/profesor.js"></script>
    <script src="../../../js/dashboard/profesor.js"></script>


</body>

</html>
