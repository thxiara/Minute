<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitPower - Vista Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&family=TASA+Explorer:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../../../css/dashboards/admin.css"
    >

    <link
        rel="stylesheet"
        href="../../../css/responsives/dashboardsresponsive/adminresponsive.css"
    >

</head>


<body>

    <div class="container-fluid admin-page p-0">


        <!-- header -->

        <header class="admin-header">

            <div class="container-fluid h-100">

                <div class="row h-100 align-items-center">

                    <div class="col">

                        <div class="logo">
                            FitPower
                        </div>

                    </div>


                    <div class="col-auto">

                        <div class="usuario-header d-flex align-items-center">

                            <span class="nombre-usuario">
                                Nombre Apellido
                            </span>


                            <img src="../../../assets/imagenes/img6.jpg" alt="Usuario" class="imagen-usuario">


                            <button
                                class="boton-menu"
                                type="button"
                                data-bs-toggle="offcanvas"
                                data-bs-target="#menuLateral"
                                aria-controls="menuLateral"
                            >

                                <span></span>
                                <span></span>
                                <span></span>

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </header>



        <!-- contenido -->

        <div class="row g-0 admin-content">


            <!-- sidebar dekstop -->

            <aside class="col-md-auto sidebar d-none d-md-block">

                <div class="sidebar-section">


                    <div class="sidebar-title">

                        <span>
                            Socios
                        </span>

                        <button
                            class="arrow-button"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#sociosMenu"
                            aria-expanded="true"
                        >
                            V
                        </button>

                    </div>


                    <div
                        class="collapse show"
                        id="sociosMenu"
                    >

                        <a
                            href="#"
                            class="sidebar-link"
                        >
                            Nuevo socio
                        </a>


                        <a
                            href="#"
                            class="sidebar-link activo"
                        >
                            Socios activos
                        </a>

                    </div>

                </div>



                <div class="sidebar-section">


                    <div class="sidebar-title">

                        <span>
                            Productos
                        </span>

                        <button
                            class="arrow-button"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#productosMenu"
                            aria-expanded="false"
                        >
                            &lt;
                        </button>

                    </div>


                    <div
                        class="collapse"
                        id="productosMenu"
                    >

                        <a
                            href="#"
                            class="sidebar-link"
                        >
                            Nuevo producto
                        </a>


                        <a
                            href="#"
                            class="sidebar-link"
                        >
                            Productos activos
                        </a>

                    </div>

                </div>

            </aside>



            <!-- menu movil -->

            <div
                class="offcanvas offcanvas-start sidebar-mobile"
                tabindex="-1"
                id="menuLateral"
            >

                <div class="offcanvas-body">

                    <div class="sidebar-section">


                        <div class="sidebar-title">

                            <span>
                                Socios
                            </span>

                            <button
                                class="arrow-button"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#sociosMobile"
                                aria-expanded="true"
                            >
                                V
                            </button>

                        </div>


                        <div
                            class="collapse show"
                            id="sociosMobile"
                        >

                            <a
                                href="adminregistrar.html"
                                class="sidebar-link"
                            >
                                Nuevo socio
                            </a>


                            <a
                                href="#"
                                class="sidebar-link activo"
                            >
                                Socios activos
                            </a>

                        </div>

                    </div>


                    <div class="sidebar-section">


                        <div class="sidebar-title">

                            <span>
                                Productos
                            </span>

                            <button
                                class="arrow-button"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#productosMobile"
                                aria-expanded="false"
                            >
                                &lt;
                            </button>

                        </div>


                        <div
                            class="collapse"
                            id="productosMobile"
                        >

                            <a
                                href="#"
                                class="sidebar-link"
                            >
                                Nuevo producto
                            </a>


                            <a
                                href="#"
                                class="sidebar-link"
                            >
                                Productos activos
                            </a>

                        </div>

                    </div>


                    <div class="sidebar-section">

                        <a
                            href="#"
                            id="logoutLink"
                            class="sidebar-link"
                        >
                            Cerrar sesión
                        </a>

                    </div>

                </div>

            </div>



            <!-- contenido principal -->

            <main class="col main-content">


                <!-- titulo principal -->

                <div class="d-flex justify-content-between align-items-center content-title">

                    <h1>
                        Socios Activos
                    </h1>


                    <a
                        href="adminregistrar.html"
                        class="btn nuevo-socio"
                    >
                        Nuevo socio
                    </a>

                </div>



                <!-- tabla -->

                <div class="members-container">


                    <!-- buscador -->

                    <div class="d-flex justify-content-between align-items-center table-top">


                        <div class="registros">

                            Mostrar

                            <select>

                                <option>
                                    25
                                </option>

                                <option>
                                    10
                                </option>

                                <option>
                                    50
                                </option>

                            </select>

                            registros

                        </div>


                        <div class="search">

                            <input
                                type="text"
                                aria-label="Buscar"
                            >

                            <button
                                type="button"
                                aria-label="Buscar"
                            >
                                ⌕
                            </button>

                        </div>

                    </div>



                    <!-- tabla -->

                    <div class="table-responsive">

                        <table class="table tabla-socios">

                            <thead>

                                <tr>

                                    <th>
                                        Nombre
                                    </th>

                                    <th>
                                        C.I
                                    </th>

                                    <th>
                                        Cel.
                                    </th>

                                    <th>
                                        Vencimiento
                                    </th>

                                    <th class="text-end">
                                        Acciones
                                    </th>

                                </tr>

                            </thead>


                            <tbody>


                                <!-- socio -->

                                <tr>

                                    <td></td>

                                    <td></td>

                                    <td></td>

                                    <td></td>


                                    <td class="acciones">

                                        <button
                                            type="button"
                                            class="action-button"
                                        >
                                            ⋮
                                        </button>


                                        <div class="action-menu">

                                            <button type="button">

                                                <span class="icono-ver">
                                                    ●
                                                </span>

                                                Ver/editar perfil

                                            </button>


                                            <button
                                                type="button"
                                                class="delete"
                                            >

                                                <span>
                                                    ⊗
                                                </span>

                                                Dar de baja

                                            </button>

                                        </div>

                                    </td>

                                </tr>



                                <!-- segunda fila -->

                                <tr>

                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>

                                    <td class="acciones">

                                        <button
                                            type="button"
                                            class="action-button"
                                        >
                                            ⋮
                                        </button>


                                        <div class="action-menu">

                                            <button type="button">

                                                <span class="icono-ver">
                                                    ●
                                                </span>

                                                Ver/editar perfil

                                            </button>


                                            <button
                                                type="button"
                                                class="delete"
                                            >

                                                <span>
                                                    ⊗
                                                </span>

                                                Dar de baja

                                            </button>

                                        </div>

                                    </td>

                                </tr>


                            </tbody>

                        </table>

                    </div>



                    <!-- paginacion -->

                    <div class="pagination">

                        <button type="button">
                            ←
                        </button>

                        <button type="button">
                            →
                        </button>

                    </div>


                </div>


            </main>


        </div>

    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../../../js/api.js"></script>
    <script src="../../../js/session.js"></script>
    <script src="../../../js/dashboard/admin.js"></script>

    <script>
        (async () => {
            const sesion = await Session.requireRole([Session.ROLES.ADMIN], '../../login.html');
            if (!sesion) return;

            const nombreUsuario = document.querySelector('.nombre-usuario');
            if (nombreUsuario) {
                nombreUsuario.textContent = sesion.name;
            }

            const logoutLink = document.getElementById('logoutLink');
            if (logoutLink) {
                logoutLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    Session.logout('/front/index.html');
                });
            }
        })();
    </script>

</body>
</html>
