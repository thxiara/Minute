<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitPower - Nuevo socio</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&family=TASA+Explorer:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../../../css/dashboards/adminregistrar.css"
    >

    <link
        rel="stylesheet"
        href="../../../css/responsives/dashboardsresponsive/adminregistrarresponsive.css"
    >

</head>


<body>

    <div class="container-fluid admin-page p-0">


        <!-- header -->

        <header class="admin-header">

            <div class="container-fluid h-100">

                <div class="row h-100 align-items-center">

                    <div class="col">

                        <div class="logo">
                            FitPower
                        </div>

                    </div>


                    <div class="col-auto">

                        <div class="usuario-header d-flex align-items-center">

                            <span class="nombre-usuario">
                                Nombre Apellido
                            </span>


                            <img
                                src="../../../assets/imágenes/img6.jpg"
                                alt="Usuario"
                                class="imagen-usuario"
                            >


                            <button
                                class="boton-menu"
                                type="button"
                                data-bs-toggle="offcanvas"
                                data-bs-target="#menuLateral"
                                aria-controls="menuLateral"
                            >

                                <span></span>
                                <span></span>
                                <span></span>

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </header>



        <!-- contenido -->

        <div class="row g-0 admin-content">


            <!-- sidebar desktop -->

            <aside class="col-md-auto sidebar d-none d-md-block">

                <div class="sidebar-section">


                    <div class="sidebar-title">

                        <span>
                            Socios
                        </span>


                        <button
                            class="arrow-button"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#sociosMenu"
                            aria-expanded="true"
                        >
                            V
                        </button>

                    </div>


                    <div
                        class="collapse show"
                        id="sociosMenu"
                    >

                        <a
                            href="#"
                            class="sidebar-link activo"
                        >
                            Nuevo socio
                        </a>


                        <a
                            href="#"
                            class="sidebar-link"
                        >
                            Socios activos
                        </a>

                    </div>

                </div>



                <div class="sidebar-section">


                    <div class="sidebar-title">

                        <span>
                            Productos
                        </span>


                        <button
                            class="arrow-button"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#productosMenu"
                            aria-expanded="false"
                        >
                            &lt;
                        </button>

                    </div>


                    <div
                        class="collapse"
                        id="productosMenu"
                    >

                        <a
                            href="#"
                            class="sidebar-link"
                        >
                            Nuevo producto
                        </a>


                        <a
                            href="#"
                            class="sidebar-link"
                        >
                            Productos activos
                        </a>

                    </div>

                </div>

            </aside>



            <!-- menu movil -->

            <div
                class="offcanvas offcanvas-start sidebar-mobile"
                tabindex="-1"
                id="menuLateral"
            >

                <div class="offcanvas-body">

                    <div class="sidebar-section">


                        <div class="sidebar-title">

                            <span>
                                Socios
                            </span>


                            <button
                                class="arrow-button"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#sociosMobile"
                                aria-expanded="true"
                            >
                                V
                            </button>

                        </div>


                        <div
                            class="collapse show"
                            id="sociosMobile"
                        >

                            <a
                                href="adminregistrar.html"
                                class="sidebar-link activo"
                            >
                                Nuevo socio
                            </a>


                            <a
                                href="admin.html"
                                class="sidebar-link"
                            >
                                Socios activos
                            </a>

                        </div>

                    </div>



                    <div class="sidebar-section">


                        <div class="sidebar-title">

                            <span>
                                Productos
                            </span>


                            <button
                                class="arrow-button"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#productosMobile"
                                aria-expanded="false"
                            >
                                &lt;
                            </button>

                        </div>


                        <div
                            class="collapse"
                            id="productosMobile"
                        >

                            <a
                                href="#"
                                class="sidebar-link"
                            >
                                Nuevo producto
                            </a>


                            <a
                                href="#"
                                class="sidebar-link"
                            >
                                Productos activos
                            </a>

                        </div>

                    </div>

                </div>

            </div>



            <!-- contenido principal -->

            <main class="col main-content registrar-content">


                <div class="registro-container">


                    <h1>
                        Nuevo socio
                    </h1>


                    <div class="form-line"></div>


                    <form>


                        <div class="row">


                            <div class="col-md-4 campo">

                                <label for="nombre">
                                    Nombre y apellido *
                                </label>


                                <input
                                    type="text"
                                    id="nombre"
                                    name="nombre"
                                >

                            </div>



                            <div class="col-md-4 campo">

                                <label for="ci">
                                    C.I *
                                </label>


                                <input
                                    type="text"
                                    id="ci"
                                    name="ci"
                                >

                            </div>



                            <div class="col-md-4 campo">

                                <label for="telefono">
                                    Teléfono *
                                </label>


                                <input
                                    type="text"
                                    id="telefono"
                                    name="telefono"
                                >

                            </div>

                        </div>



                        <div class="row">


                            <div class="col-md-4 campo">

                                <label for="email">
                                    E-mail *
                                </label>


                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                >

                            </div>



                            <div class="col-md-4 campo">

                                <label for="fecha">
                                    Fecha de nacimiento *
                                </label>


                                <input
                                    type="date"
                                    id="fecha"
                                    name="fecha"
                                >

                            </div>



                            <div class="col-md-4 campo">

                                <label for="plan">
                                    Plan *
                                </label>

                            <select id="plan" name="plan">
                                 <option value=""></option>
                                 <option value="basico">Básico</option>
                                 <option value="pro">Pro</option>
                                 <option value="premium">Premium</option>
                            </select>

                            </div>

                        </div>



                        <div class="row">


                            <div class="col-md-4 campo">

                                <label for="contrasena">
                                    Contraseña *
                                </label>


                                <input
                                    type="password"
                                    id="contrasena"
                                    name="contrasena"
                                >

                            </div>

                        </div>



                        <div class="form-line form-line-final"></div>



                        <div class="form-buttons">


                            <button
                                type="button"
                                class="btn-cancelar"
                            >
                                Cancelar
                            </button>


                            <button
                                type="submit"
                                class="btn-guardar"
                            >
                                Guardar
                            </button>

                        </div>


                    </form>

                </div>


            </main>


        </div>

    </div>



    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>



    <script src="../../../js/dashboard/adminregistrar.js"></script>


</body>

</html>
