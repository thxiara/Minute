<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | FitPower</title>
    <link rel="icon" type="image/png" href="./assets/iconos/favicon.png?v=20261113">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&family=TASA+Explorer:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/front/dist/css/styles.css?v=20261113">
    <style>
        .error-404 {
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }

        .error-404 h1 {
            margin: 0;
            color: var(--color-accent-bright);
            font-family: "Special Gothic Expanded One", sans-serif;
            font-size: clamp(5rem, 18vw, 10rem);
            font-weight: 400;
            line-height: 1;
            text-shadow: 0 18px 42px color-mix(in srgb, var(--color-accent) 30%, transparent);
        }

        .error-404 p {
            max-width: 34ch;
            margin: 18px auto 0;
            color: var(--color-text-secondary);
            font-size: clamp(1rem, 2vw, 1.2rem);
            line-height: 1.6;
        }
    </style>
</head>
<body class="interface-page">
    <main class="error-404">
        <div>
            <h1>404</h1>
            <p>La página que buscas no existe o fue movida.</p>
        </div>
    </main>
</body>
</html>
