<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | FitPower</title>
    <link rel="icon" type="image/png" href="/front/dist/assets/iconos/favicon.png?v=20261113">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&family=TASA+Explorer:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/front/dist/css/styles.css?v=20261114">
    <style>
        /* Contenedor 404 */
        .error-404 {
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }

        /* Número 404 */
        .error-404 h1 {
            margin: 0;
            color: var(--color-accent-bright);
            font-family: "Special Gothic Expanded One", sans-serif;
            font-size: clamp(5rem, 18vw, 10rem);
            font-weight: 400;
            line-height: 1;
            text-shadow: 0 18px 42px color-mix(in srgb, var(--color-accent) 30%, transparent);
        }

        /* Mensaje 404 */
        .error-404 p {
            max-width: 34ch;
            margin: 18px auto 0;
            color: var(--color-text-secondary);
            font-size: clamp(1rem, 2vw, 1.2rem);
            line-height: 1.6;
        }

        /* Botón volver */
        .error-404-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 28px;
            padding: 14px 30px;
            border-radius: 10px;
            background: var(--gradient-button);
            box-shadow: 0 9px 22px color-mix(in srgb, var(--color-accent) 22%, transparent);
            color: var(--color-text);
            font-weight: 700;
            transition: background 180ms ease, transform 180ms ease;
        }

        .error-404-btn:hover {
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-hover));
            color: var(--color-text);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="interface-page">
    <!-- Página 404 -->
    <main class="error-404">
        <div>
            <h1>404</h1>
            <p>La página que buscas no existe o fue movida.</p>
            <a href="/" class="error-404-btn">
                <span aria-hidden="true">←</span>
                Volver al inicio
            </a>
        </div>
    </main>
</body>
</html>
